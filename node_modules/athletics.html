<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athletics & Arts | Noble Heights School</title>
    <link href="./output.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer"
    />

</head>

<body>

    <section id="inquiry-form-section" class="py-16 bg-slate-50 px-6 rounded-[3rem] my-12 border border-gray-100 max-w-4xl mx-auto shadow-xl">
        <div class="text-center mb-10">
            <h3 class="text-3xl font-black text-blue-900 uppercase mb-2">Athletics Registration Form</h3>
            <p class="text-gray-400 text-sm">Please fill out this form to register your child for sports clubs.</p>
        </div>

        <form id="athleticsForm" class="space-y-6 max-w-2xl mx-auto">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Student Name</label>
                    <input type="text" required placeholder="John Doe" class="w-full bg-white border border-gray-200 rounded-2xl px-5 py-4 focus:border-blue-900 outline-none transition-all text-sm">
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Parent Contact Number</label>
                    <input type="tel" required placeholder="+92 300 1234567" class="w-full bg-white border border-gray-200 rounded-2xl px-5 py-4 focus:border-blue-900 outline-none transition-all text-sm">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Select Sports Club</label>
                <select required class="w-full bg-white border border-gray-200 rounded-2xl px-5 py-4 focus:border-blue-900 outline-none transition-all text-sm appearance-none">
                <option value="" disabled selected>Choose a club...</option>
                <option value="swimming">Swimming Club (Aqua Sharks)</option>
                <option value="basketball">Basketball Club</option>
                <option value="cricket">Cricket Academy</option>
            </select>
            </div>

            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-black py-4 rounded-2xl shadow-lg transition duration-300 uppercase tracking-wider text-xs mt-4">
            Submit Registration
        </button>
        </form>
    </section>

    <script>
        document.getElementById('athleticsForm').addEventListener('submit', (e) => {
            e.preventDefault(); // Page refresh hone se rokne ke liye
            alert("Thank you! Your registration request for Noble Heights Sports Club has been submitted successfully.");
            e.target.reset(); // Form ko clear karne ke liye
        });
    </script>
</body>

</html>
