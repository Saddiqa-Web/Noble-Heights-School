<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noble Hieghts School</title>
    <link href="./output.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer"
    />
</head>

<body class="bg-blue-900 min-h-screen flex items-center justify-center p-6">


    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden">
        <!-- Top Section -->
        <div class="bg-yellow-400 p-8 text-center">
            <div class="w-20 h-20 bg-blue-900 rounded-2xl mx-auto flex items-center justify-center shadow-lg mb-4">
                <i class="fas fa-user-graduate text-white text-3xl"></i>
            </div>
            <h1 class="text-2xl font-black text-blue-900 uppercase">Student Portal</h1>
            <p class="text-blue-800 text-sm font-medium">Noble Heights School, Rawalpindi</p>
        </div>

        <!-- Login Form Placeholder -->
        <div class="p-8">
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Student ID</label>
                    <input type="text" placeholder="NHS-2026-XXXX" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-900 focus:ring-2 focus:ring-blue-200 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Password</label>
                    <input type="password" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-900 focus:ring-2 focus:ring-blue-200 outline-none transition-all">
                </div>

                <button onclick="showNotice()" class="w-full bg-blue-900 text-white font-bold py-4 rounded-xl hover:bg-blue-800 transition-all shadow-lg active:scale-95">
                    Sign In
                </button>
            </div>

            <!-- Coming Soon Notice (Hidden by default) -->
            <div id="notice" class="hidden mt-6 p-4 bg-yellow-50 border-l-4 border-yellow-400 rounded-r-lg">
                <p class="text-sm text-yellow-800 font-medium">
                    <i class="fas fa-info-circle mr-2"></i> This portal is currently under maintenance. Please check back later!
                </p>
            </div>

            <div class="mt-8 text-center">
                <a href="index.html" class="text-sm text-blue-900 font-bold hover:underline">← Back to Homepage</a>
            </div>
        </div>
    </div>


    <script>
        function showNotice() {
            document.getElementById('notice').classList.remove('hidden');
        }
    </script>

</body>

</html>
