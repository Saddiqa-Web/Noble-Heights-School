<html lang="en">

<head>

<body>
    <!DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>Student Dashboard | Noble Heights</title>
        <link href="./output.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer"
        />
    </head>

    <body class="bg-slate-50 p-10">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-3xl font-black text-blue-900 mb-8 uppercase">Student Dashboard</h1>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Attendance Card -->
                <div class="bg-white p-8 rounded-[2rem] shadow-lg border-t-4 border-yellow-400">
                    <h3 class="font-bold text-gray-400 uppercase text-xs mb-2">Monthly Attendance</h3>
                    <p class="text-4xl font-black text-blue-900">95%</p>
                    <p class="text-green-500 text-xs mt-2 font-bold">Excellent Standing</p>
                </div>

                <!-- Exam Results Card -->
                <div class="bg-white p-8 rounded-[2rem] shadow-lg border-t-4 border-blue-900">
                    <h3 class="font-bold text-gray-400 uppercase text-xs mb-2">Latest Result</h3>
                    <p class="text-4xl font-black text-blue-900">Grade A+</p>
                    <p class="text-gray-500 text-xs mt-2 italic">Mid-Term Exams 2026</p>
                </div>
            </div>

            <a href="index.html" class="inline-block mt-10 text-blue-900 font-bold underline">Logout</a>
        </div>
    </body>

    </html>
</body>

</html>
